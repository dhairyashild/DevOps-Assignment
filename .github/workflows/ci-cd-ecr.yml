name: CI/CD → AWS ECR (DevOps Assignment)
on:
  push:
    branches: [feature/docker, develop, main]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 570043747352.dkr.ecr.ap-south-1.amazonaws.com
  ECR_BACKEND_REPO: devops-backend
  ECR_FRONTEND_REPO: devops-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Backend Tests
      run: |
        docker build ./backend -t backend:test .
        docker run backend:test pytest --verbose
        
    - name: Frontend Tests
      run: |
        docker build ./frontend -t frontend:test .
        docker run frontend:test npm test

  docker-ecr:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push Backend
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build ./backend \
          -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

    - name: Build & Push Frontend
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build ./frontend \
          -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
